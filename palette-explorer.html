<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palette Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Serif+Display:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fbfbfa;
        --surface: #ffffff;
        --surface-2: #f8f8f6;
        --border: #e7e6e2;
        --text: #121211;
        --muted: #70706c;
        --blue: #1647a3;
        --blue-soft: #edf3ff;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Outfit", sans-serif;
        font-size: 14px;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: end;
        padding: 14px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 700;
        color: var(--muted);
      }

      .input {
        width: 100%;
        min-height: 38px;
        border: 1px solid #d8d7d1;
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        font: 500 13px/1.2 "Outfit", sans-serif;
        padding: 0 11px;
      }

      .input:focus {
        outline: none;
        border-color: #8eb0ef;
        box-shadow: 0 0 0 4px rgba(22, 71, 163, 0.12);
      }

      .status {
        min-height: 38px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        border: 1px solid #bdd0f6;
        background: var(--blue-soft);
        color: var(--blue);
        padding: 0 12px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 700;
        white-space: nowrap;
      }

      .list {
        overflow: auto;
        padding: 10px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 10px;
      }

      .card {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        padding: 10px;
        text-align: left;
        cursor: pointer;
        display: grid;
        gap: 8px;
      }

      .card:hover {
        border-color: #bfd1f5;
      }

      .card.active {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(22, 71, 163, 0.12);
      }

      .swatches {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        border-radius: 8px;
        overflow: hidden;
        min-height: 22px;
        border: 1px solid #ecebe8;
      }

      .swatch {
        min-width: 8px;
      }

      .name {
        font: 700 13px/1.2 "Outfit", sans-serif;
        color: var(--text);
        margin: 0;
      }

      .meta {
        margin: 0;
        font: 500 11px/1.35 "Outfit", sans-serif;
        color: var(--muted);
      }

      .empty {
        border: 1px dashed #d6d5d0;
        border-radius: 12px;
        background: #fff;
        padding: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 760px) {
        .toolbar {
          grid-template-columns: 1fr;
        }

        .status {
          justify-self: start;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="toolbar">
        <label class="field">
          <span class="label">Buscar paleta</span>
          <input id="searchInput" class="input" type="text" placeholder="Ex: viridis, set2, spectral" />
        </label>

        <div class="status" id="statusBadge">Loading...</div>
      </div>

      <div class="list" id="listContainer"></div>
    </div>

    <script src="./data/palettes.js"></script>
    <script>
      (function () {
        const DATA_URL = "./data/palettes.json";
        const searchInput = document.getElementById("searchInput");
        const statusBadge = document.getElementById("statusBadge");
        const listContainer = document.getElementById("listContainer");

        const state = {
          palettes: [],
          language: "r",
          query: "",
          selectedName: "",
          visibleLimit: 120
        };

        function normalizeLanguage(value) {
          return value === "python" ? "python" : "r";
        }

        function normalizeHex(color) {
          const value = String(color || "").trim();
          if (!value) return "";
          if (/^#[0-9a-f]{6,8}$/i.test(value)) return value;
          return "";
        }

        function filteredPalettes() {
          const query = state.query.trim().toLowerCase();
          if (!query) return state.palettes;
          return state.palettes.filter((p) => {
            const hay = `${p.name} ${p.kind} ${p.source}`.toLowerCase();
            return hay.includes(query);
          });
        }

        function getSelectedPalette() {
          return state.palettes.find((p) => p.name === state.selectedName) || null;
        }

        function setUrlParams() {
          const url = new URL(window.location.href);
          url.searchParams.set("language", state.language);
          if (state.selectedName) {
            url.searchParams.set("palette", state.selectedName);
          } else {
            url.searchParams.delete("palette");
          }
          history.replaceState({}, "", url);
        }

        function syncFromQueryString() {
          const params = new URLSearchParams(window.location.search);
          state.language = normalizeLanguage(params.get("language") || "r");
          state.selectedName = (params.get("palette") || "").trim();
        }

        function postSelection() {
          const selected = getSelectedPalette();
          if (!selected) return;

          window.parent.postMessage(
            {
              type: "palette-change",
              paletteName: selected.name,
              language: state.language,
              colors: selected.palette,
              source: selected.source,
              kind: selected.kind
            },
            "*"
          );
        }

        function createCard(palette) {
          const swatches = palette.palette
            .slice(0, 20)
            .map((color) => `<span class="swatch" style="background:${color}"></span>`)
            .join("");

          const selectedClass = palette.name === state.selectedName ? " active" : "";

          return `
            <button class="card${selectedClass}" type="button" data-name="${palette.name.replace(/"/g, "&quot;")}">
              <div class="swatches">${swatches}</div>
              <p class="name">${palette.name}</p>
              <p class="meta">${palette.kind || "unknown"} • ${palette.palette.length} colors</p>
              <p class="meta">${palette.source || "source not available"}</p>
            </button>
          `;
        }

        function renderList() {
          const filtered = filteredPalettes();
          const visible = filtered.slice(0, state.visibleLimit);

          statusBadge.textContent = `${filtered.length} palettes`;

          if (!filtered.length) {
            listContainer.innerHTML = '<div class="empty">Nenhuma paleta encontrada para esse filtro.</div>';
            return;
          }

          listContainer.innerHTML = `<div class="cards">${visible.map(createCard).join("")}</div>`;

          listContainer.querySelectorAll(".card").forEach((button) => {
            button.addEventListener("click", () => {
              const nextName = button.dataset.name || "";
              if (!nextName || nextName === state.selectedName) return;
              state.selectedName = nextName;
              setUrlParams();
              renderList();
              postSelection();
            });
          });
        }

        function ensureSelectedPalette() {
          if (!state.palettes.length) return;
          const requested = String(state.selectedName || "").trim().toLowerCase();
          if (requested) {
            const match = state.palettes.find((p) => p.name.toLowerCase() === requested);
            if (match) {
              state.selectedName = match.name;
              return;
            }
          }
          state.selectedName = state.palettes[0].name;
        }

        listContainer.addEventListener("scroll", () => {
          const filtered = filteredPalettes();
          if (state.visibleLimit >= filtered.length) return;
          const nearBottom = listContainer.scrollTop + listContainer.clientHeight >= listContainer.scrollHeight - 140;
          if (!nearBottom) return;
          state.visibleLimit += 120;
          renderList();
        });

        searchInput.addEventListener("input", () => {
          state.query = searchInput.value;
          state.visibleLimit = 120;
          renderList();
        });

        async function init() {
          syncFromQueryString();

          let raw;
          try {
            const response = await fetch(DATA_URL, { cache: "force-cache" });
            if (!response.ok) {
              throw new Error(`Could not load ${DATA_URL}: ${response.status}`);
            }
            raw = await response.json();
          } catch (error) {
            if (Array.isArray(window.__LOCAL_PALETTES__) && window.__LOCAL_PALETTES__.length) {
              raw = window.__LOCAL_PALETTES__;
            } else {
              statusBadge.textContent = "load error";
              listContainer.innerHTML = `<div class="empty">Erro ao carregar paletas locais.<br>${String(error.message || error)}<br><br>Dica: rode <code>python3 -m http.server 8000</code> na pasta do projeto.</div>`;
              return;
            }
          }

          state.palettes = raw
            .map((item) => ({
              name: String(item.name || "").trim(),
              palette: Array.isArray(item.palette) ? item.palette.map(normalizeHex).filter(Boolean) : [],
              source: String(item.source || "").trim(),
              kind: String(item.kind || "").trim()
            }))
            .filter((item) => item.name && item.palette.length);

          state.palettes.sort((a, b) => a.name.localeCompare(b.name));
          ensureSelectedPalette();
          setUrlParams();
          renderList();
          postSelection();
        }

        init();
      })();
    </script>
  </body>
</html>
